<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASHITAKU（アシタク）｜明日の持ち物・課題・テスト勉強をまとめて管理（無料）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<meta name="description" content="ASHITAKU（アシタク）は、高校生・中学生向けの無料の学校アプリです。時間割から明日の持ち物を自動でチェック。課題の締切管理と、テスト勉強の1日ぶんの量の自動計算もできます。登録不要、データは自分のスマホの中だけに保存されます。">
<meta property="og:title" content="ASHITAKU（アシタク）｜明日の持ち物・課題・テスト勉強をまとめて管理">
<meta property="og:description" content="時間割から明日の持ち物を自動チェック。課題の締切管理と、テスト勉強の計画もこれ1つで。無料・登録不要。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3b6cf6">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アシタク">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--sub:#6b7385;--accent:#3b6cf6;--accent-t:#fff;--line:#e3e6ee;--ok:#1f9d63;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#eef0f6;--sub:#9aa3b5;--accent:#6c8cff;--accent-t:#0e1220;--line:#2c3342;--ok:#4cd197;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#eef0f6;--sub:#9aa3b5;--accent:#6c8cff;--accent-t:#0e1220;--line:#2c3342;--ok:#4cd197;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
.logo{display:inline-block;font-family:"Montserrat",-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:34px;letter-spacing:.1em;line-height:1.1;background:linear-gradient(90deg,var(--accent),#a855f7 70%,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tagline{display:block;font-size:13px;font-weight:500;color:var(--sub);letter-spacing:.08em;margin-top:6px}
.hd{margin:6px 0 16px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.row.done span.n{text-decoration:line-through;color:var(--sub)}
.tag{font-size:11px;color:var(--sub);margin-left:6px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
select,input[type=text],input[type=date],input[type=number]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
.grid{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font-size:14px}
.btn.g{background:transparent;color:var(--sub);border:1px solid var(--line)}
.flex{display:flex;gap:8px}
.scroll{overflow-x:auto}
h2{font-size:16px;margin:0 0 8px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cg>*{min-width:0}
</style>
</head>
<body>
<div class="wrap">
<div id="back"></div><h1 id="ttl"><span class="logo">ASHITAKU</span><span class="tagline">明日の支度、これ1つで。</span></h1>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
var DAYS=['日','月','火','水','木','金','土'];
var DEF={
 timetable:{1:['国語','数学','英語','理科','社会','体育'],2:['数学','英語','国語','音楽','美術','理科'],3:['英語','社会','数学','国語','理科','技術'],4:['理科','国語','体育','数学','英語','社会'],5:['社会','英語','数学','国語','体育','理科']},
 items:{'国語':'教科書,ノート,漢字ドリル','数学':'教科書,ノート,定規','英語':'教科書,ノート,辞書','理科':'教科書,ノート,資料集','社会':'教科書,ノート,地図帳','体育':'体操服,体育館シューズ','音楽':'教科書,リコーダー','美術':'絵の具セット','技術':'教科書,ノート'},
 common:'筆箱,スマホ,定期券,弁当',
 checked:{}
};
var S=load();var tab='home';
function load(){try{var r=localStorage.getItem('mochimono_v1');if(r){var o=JSON.parse(r);if(o&&o.timetable)return o}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem('mochimono_v1',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function split(s){return String(s||'').split(/[,、，]/).map(function(x){return x.trim()}).filter(Boolean)}
function nextDay(){var d=new Date();d.setDate(d.getDate()+1);var first=true;while(d.getDay()==0||d.getDay()==6){d.setDate(d.getDate()+1);first=false}
 var k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();return {d:d,k:k,wd:d.getDay(),near:first}}
function tomorrowItems(wd,k){var map={},order=[];
 (S.timetable[wd]||[]).forEach(function(sub){if(!sub)return;split(S.items[sub]).forEach(function(it){if(!map[it]){map[it]=[];order.push(it)}if(map[it].indexOf(sub)<0)map[it].push(sub)})});
 var res=order.map(function(it){return {name:it,subs:map[it]}});
 split(S.common).forEach(function(it){if(!map[it])res.push({name:it,subs:['毎日']})});
 ((S.extra||{})[k]||[]).forEach(function(it){if(!res.some(function(x){return x.name==it}))res.push({name:it,subs:['追加'],extra:true})});var w=wx?wxDay(padK(k)):null;if(w&&w.lvl>0){(w.lvl==3?['傘','カッパ']:w.lvl==2?['傘']:['折りたたみ傘']).forEach(function(it){if(!res.some(function(x){return x.name==it}))res.push({name:it,subs:['天気']})})}return res}
function tabsHtml(){var t=[['home','持ち物'],['tt','時間割'],['it','設定']];
 document.getElementById('tabs').innerHTML=t.map(function(x){return '<button class="'+(tab==x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>'}).join('')}
function render(){var v=document.getElementById('view'),tb=document.getElementById('tabs'),ttl=document.getElementById('ttl');document.getElementById('back').innerHTML=screen=='menu'?'':'<button class="btn g" data-go="menu" style="margin-bottom:8px">← ホーム</button>';
 if(screen=='menu'){tb.innerHTML='';ttl.innerHTML='<span class="logo">ASHITAKU</span><span class="tagline">明日の支度、これ1つで。</span>';v.innerHTML=menu();return}
 if(screen=='kadai'){tb.innerHTML='';ttl.textContent='📝 課題管理';v.innerHTML=hwView();return}
 if(screen=='cal'){tb.innerHTML='';ttl.textContent='📅 カレンダー';v.innerHTML=calView();return}
 if(screen=='fukushu'){tb.innerHTML='';ttl.textContent='📚 復習スケジューラー';v.innerHTML=rvView();return}
 ttl.textContent='🎒 明日の持ち物チェック';tabsHtml();
 if(tab=='home')v.innerHTML=home();else if(tab=='tt')v.innerHTML=tt();else v.innerHTML=itemsView()}
function home(){var n=nextDay(),list=tomorrowItems(n.wd,n.k),ck=S.checked[n.k]||[];
 var done=list.filter(function(x){return ck.indexOf(x.name)>=0}).length;var pct=list.length?Math.round(done/list.length*100):0;
 var label=(n.near?'明日':'次の登校日')+'（'+(n.d.getMonth()+1)+'/'+n.d.getDate()+' '+DAYS[n.wd]+'曜日）';
 var subs='<div class="sub">'+esc((S.timetable[n.wd]||[]).filter(Boolean).join('・')||'時間割が未入力です')+'</div>';
 var h='<div class="card"><h2>'+label+'</h2>'+subs+'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="sub">'+done+' / '+list.length+' 準備OK'+(list.length&&done==list.length?' 🎉':'')+'</div></div><div class="card">';
 if(!list.length)h+='<div class="sub">「時間割」タブで科目を入れてみてください。</div>';
 var idx=list.map(function(x,i){return i});idx=idx.filter(function(i){return ck.indexOf(list[i].name)<0}).concat(idx.filter(function(i){return ck.indexOf(list[i].name)>=0}));
 var hdr=false;idx.forEach(function(i){var x=list[i];var on=ck.indexOf(x.name)>=0;if(on&&!hdr){hdr=true;h+='<button class="btn g" data-fold="1" style="width:100%;text-align:left;margin-top:10px">📁 準備OK（'+done+'） '+(doneOpen?'▲':'▼')+'</button>'}if(on&&!doneOpen)return;h+='<label class="row'+(on?' done':'')+'"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+'><span class="n">'+esc(x.name)+'</span><span class="tag">'+esc(x.subs.join('・'))+'</span>'+(x.extra?'<button class="btn g" data-xdel="'+i+'" style="padding:2px 10px;margin-left:auto">×</button>':'')+'</label>'});
 h+='<div class="flex" style="margin-top:12px"><input type="text" id="xin" placeholder="＋ 持ち物を追加（例：提出するプリント）"><button class="btn" id="xadd">追加</button></div></div>';if(list.length)h+='<button class="btn g" id="reset">チェックをリセット</button>';return h}
function tt(){var subs=Object.keys(S.items);var h='';
 if(SAMPLE&&ttEdit)h+='<div class="card"><label class="btn" for="photo" style="display:inline-block">📷 写真から時間割を読み取る</label><input type="file" id="photo" accept="image/*" hidden><div class="sub" style="margin-top:8px">時間割表の写真を選ぶと、自動で入力します。写真はClaudeに送られて読み取られます。</div>'+(ttMsg?'<div style="margin-top:8px;font-size:14px">'+esc(ttMsg)+'</div>':'')+'</div>';
 h+='<div class="flex" style="align-items:center;margin-bottom:10px"><div class="sub" style="flex:1">'+(ttEdit?'曜日ごとに、1〜7時間目の科目を選んでください。':'教科の忘れ物がなければ、チェックを押してね。')+'</div><button class="btn'+(ttEdit?'':' g')+'" id="ttedit">'+(ttEdit?'完了':'✏️ 編集')+'</button></div>';
 var td=new Date().getDay(),st=(td>=1&&td<=5)?td:1,ord=[];for(var o=0;o<5;o++)ord.push((st-1+o)%5+1);
 ord.forEach(function(d){h+='<div class="card"><h2>'+DAYS[d]+'曜日'+(dayInfo(d).off==0?'（今日）':dayInfo(d).off==1?'（明日）':'')+'</h2>';
  if(!ttEdit){var dk=dayInfo(d).k,sd2=(S.subjDone||{})[dk]||[];(S.timetable[d]||[]).forEach(function(s,p){if(!s)return;var on=sd2.indexOf(p)>=0;h+='<label class="row'+(on?' done':'')+'" style="padding:8px 0"><input type="checkbox" data-sp="'+p+'" data-sk="'+dk+'"'+(on?' checked':'')+'><span class="sub" style="width:22px">'+(p+1)+'</span><span class="n">'+esc(s)+'</span></label>'})}else for(var p=0;p<7;p++){var cur=(S.timetable[d]||[])[p]||'';h+='<div class="grid"><span class="sub">'+(p+1)+'</span><select data-d="'+d+'" data-p="'+p+'"><option value="">（なし）</option>'+subs.map(function(s){return '<option'+(s==cur?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></div>'}
  h+='</div>'});return h}
function itemsView(){var h='<div class="sub" style="margin-bottom:10px">科目ごとの持ち物を、カンマ区切りで入力します。</div><div class="card"><h2>毎日の持ち物</h2><input type="text" id="common" value="'+esc(S.common)+'"></div>';
 Object.keys(S.items).forEach(function(s,i){h+='<div class="card"><h2>'+esc(s)+'</h2><input type="text" data-s="'+i+'" value="'+esc(S.items[s])+'"><div style="margin-top:8px"><button class="btn g" data-del="'+i+'">この科目を削除</button></div></div>'});
 h+='<div class="card"><h2>科目を追加</h2><div class="flex"><input type="text" id="newsub" placeholder="例：家庭科"><button class="btn" id="add">追加</button></div></div>';return h}
document.addEventListener('click',function(e){var t=e.target;
 if(t.dataset.t){tab=t.dataset.t;render();return}
 var g=t.closest&&t.closest('[data-go]');if(g){screen=g.dataset.go;phMsg='';calMsg='';render();return}
 if(t.id=='rvadd'){var f=parseInt(document.getElementById('rvfrom').value),e2=parseInt(document.getElementById('rvto').value),tst=document.getElementById('rvtest').value,tdy=new Date();tdy.setHours(0,0,0,0);
  if(!(f>0&&e2>=f)){rvMsg='ページの範囲を正しく入れてね（開始 ≦ 終了）';render();return}
  if(!tst||new Date(tst+'T00:00:00')<tdy){rvMsg='テスト日は今日以降の日付にしてね';render();return}
  S.rv=S.rv||[];S.rv.push({id:Date.now().toString(36),sub:document.getElementById('rvsub').value,from:f,to:e2,test:tst,prog:0,lastDone:'',lastAmt:0});rvMsg='';save();render();return}
 if(t.dataset.rvdel){S.rv=(S.rv||[]).filter(function(x){return x.id!=t.dataset.rvdel});save();render();return}
 if(t.dataset.rvdone){(S.rv||[]).forEach(function(x){if(x.id==t.dataset.rvdone){var o=rvInfo(x);if(o.state=='todo'){x.prog=(x.prog||0)+o.amt;x.lastDone=o.tk;x.lastAmt=o.amt}}});save();render();return}
 if(t.dataset.rvundo){(S.rv||[]).forEach(function(x){if(x.id==t.dataset.rvundo){x.prog=Math.max(0,(x.prog||0)-(x.lastAmt||0));x.lastDone='';x.lastAmt=0}});save();render();return}
 if(t.id=='wxgo'){wxLoad();return}
 if(t.dataset.cm){calM+=+t.dataset.cm;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();return}
 if(t.dataset.cd){calSel=t.dataset.cd;render();return}
 if(t.dataset.cdel){S.ev=(S.ev||[]).filter(function(x){return x.id!=t.dataset.cdel});save();render();return}
 if(t.id=='caladd'){var ct=document.getElementById('calt').value.trim();if(!ct){calMsg='内容を入れてね';render();return}S.ev=S.ev||[];S.ev.push({id:Date.now().toString(36),date:calSel,title:ct,type:document.getElementById('calty').value});calMsg='';save();render();return}
 if(t.id=='hwadd'){var tx=document.getElementById('hwtext').value.trim();if(tx){S.hw=S.hw||[];S.hw.push({id:Date.now().toString(36),sub:document.getElementById('hwsub').value,text:tx,due:document.getElementById('hwdue').value,done:false});save();render()}return}
 if(t.dataset.hwdel){S.hw=(S.hw||[]).filter(function(x){return x.id!=t.dataset.hwdel});save();render();return}
 if(t.dataset.hwfold){hwOpen=!hwOpen;render();return}
 if(t.id=='ttedit'){ttEdit=!ttEdit;render();return}
 if(t.dataset.fold){doneOpen=!doneOpen;render();return}
 if(t.id=='xadd'){var xv=document.getElementById('xin').value.trim();if(xv){var nn=nextDay();S.extra=S.extra||{};var xa=S.extra[nn.k]=S.extra[nn.k]||[];if(xa.indexOf(xv)<0)xa.push(xv);save();render()}return}
 if(t.dataset.xdel!==undefined){var n2=nextDay(),l2=tomorrowItems(n2.wd,n2.k),nm=l2[+t.dataset.xdel].name;S.extra[n2.k]=(S.extra[n2.k]||[]).filter(function(y){return y!=nm});save();render();return}
 if(t.id=='reset'){delete S.checked[nextDay().k];if(S.subjDone)delete S.subjDone[nextDay().k];save();render();return}
 if(t.id=='add'){var el=document.getElementById('newsub');var v=el.value.trim();if(v&&!S.items[v]){S.items[v]='教科書,ノート';save();render()}return}
 if(t.dataset.del!==undefined){var k=Object.keys(S.items)[+t.dataset.del];delete S.items[k];for(var d in S.timetable)S.timetable[d]=S.timetable[d].map(function(x){return x==k?'':x});save();render()}});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.hw){(S.hw||[]).forEach(function(x){if(x.id==t.dataset.hw)x.done=t.checked});save();render();return}
 if(t.id=='photo'){readPhoto(t.files[0]);t.value='';return}
 if(t.id=='hwphoto'||t.id=='rvphoto'||t.id=='calphoto'){photoAdd(t.id,t.files[0]);t.value='';return}
 if(t.dataset.sp!==undefined){var n3={k:t.dataset.sk};S.subjDone=S.subjDone||{};var a3=S.subjDone[n3.k]=S.subjDone[n3.k]||[];var q=+t.dataset.sp,j3=a3.indexOf(q);if(t.checked&&j3<0)a3.push(q);if(!t.checked&&j3>=0)a3.splice(j3,1);save();render();return}
 if(t.dataset.i!==undefined){var n=nextDay(),list=tomorrowItems(n.wd,n.k),name=list[+t.dataset.i].name;var a=S.checked[n.k]||[];var j=a.indexOf(name);if(t.checked&&j<0)a.push(name);if(!t.checked&&j>=0)a.splice(j,1);S.checked[n.k]=a;save();render();return}
 if(t.dataset.d){var d=t.dataset.d;S.timetable[d]=S.timetable[d]||['','','','','','',''];S.timetable[d][+t.dataset.p]=t.value;save();return}
 if(t.id=='common'){S.common=t.value;save();return}
 if(t.dataset.s!==undefined){S.items[Object.keys(S.items)[+t.dataset.s]]=t.value;save()}});
var hwOpen=false,screen='menu';
function menu(){var n=nextDay(),list=tomorrowItems(n.wd,n.k),ck=S.checked[n.k]||[],dn=list.filter(function(x){return ck.indexOf(x.name)>=0}).length,hw=(S.hw||[]).filter(function(x){return !x.done}).length,st='display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer';
 return wxCard()+'<button class="card" data-go="mochi" style="'+st+'"><h2>🎒 明日の持ち物チェック</h2><div class="sub">準備 '+dn+' / '+list.length+' OK</div></button><button class="card" data-go="kadai" style="'+st+';position:relative"><h2>📝 課題管理</h2><div class="sub">'+(hw>0?'未完了 '+hw+'件':'未完了の課題はありません')+'</div>'+(hw>0?'<span style="position:absolute;top:12px;right:12px;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:#e5484d;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">'+hw+'</span>':'')+'</button>'+rvCard(st)+calCard(st)}
document.addEventListener('keydown',function(e){if(e.key=='Enter'&&e.target.id=='hwtext'&&!e.isComposing)document.getElementById('hwadd').click()});
function hwView(){var list=S.hw||[],today=new Date();today.setHours(0,0,0,0);
 function dl(x){if(!x.due)return null;return Math.round((new Date(x.due+'T00:00:00')-today)/86400000)}
 function lab(x){var n=dl(x);if(n===null)return '期限なし';var md=(+x.due.slice(5,7))+'/'+(+x.due.slice(8,10));if(n<0)return '期限切れ '+md;if(n==0)return '今日まで';if(n==1)return '明日まで';return 'あと'+n+'日 '+md}
 function row(x){var n=dl(x),col=(!x.done&&n!==null&&n<=0)?'#e5484d':(!x.done&&n===1?'#e8890c':'var(--sub)');
